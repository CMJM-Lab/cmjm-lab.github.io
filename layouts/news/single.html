{{ define "main" }}
<section class="section">
  <div class="container article-container">
    <article>
      <header class="mb-4">
        <time datetime="{{ .Date.Format "2006-01-02" }}" class="news-date">{{ .Date.Format "Jan 2, 2006" }}</time>
        <h1 class="mt-2">{{ .Title }}</h1>
      </header>

      {{ if .Params.featured_image }}
      <img src="{{ .Params.featured_image }}" alt="{{ .Title }}" loading="lazy" class="featured-image">
      {{ end }}

      <div class="prose">
        {{ .Content }}
      </div>

      {{ if .Params.tags }}
      <div class="tags-section">
        <p><strong>Tags:</strong></p>
        <div>
          {{ range .Params.tags }}
          <span class="tag">{{ . }}</span>
          {{ end }}
        </div>
      </div>
      {{ end }}

      <div class="article-nav">
        <a href="/news/" class="btn btn-outline">Back to News →</a>
      </div>
    </article>
  </div>
</section>
{{ end }}
