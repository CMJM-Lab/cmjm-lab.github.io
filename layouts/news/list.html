{{ define "main" }}
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <h1>News & Updates</h1>
      <p>Latest updates from CMJM Lab</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="news-timeline">
      {{ range sort .Pages "Date" "desc" }}
      <div class="news-timeline-date">
        <time datetime="{{ .Date.Format "2006-01-02" }}" class="text-teal"><strong>{{ .Date.Format "Jan 2, 2006" }}</strong></time>
      </div>
      <article class="news-timeline-article">
        <h3><a href="{{ .Permalink }}" class="news-link-title">{{ .Title }}</a></h3>
        <p class="text-muted">{{ .Summary }}</p>
        <a href="{{ .Permalink }}" class="news-link">Read More →</a>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
