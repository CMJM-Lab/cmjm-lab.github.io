{{ define "main" }}
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <h1>News & Updates</h1>
      <p>Latest updates from CMJM Lab</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div style="display: grid; grid-template-columns: 150px 1fr; gap: var(--spacing-xl); margin-top: var(--spacing-xl);">
      {{ range sort .Pages "Date" "desc" }}
      <div style="text-align: right; padding-right: var(--spacing-lg); border-right: 2px solid var(--color-teal);">
        <strong class="text-teal">{{ .Date.Format "Jan 2, 2006" }}</strong>
      </div>
      <article style="margin-bottom: var(--spacing-2xl); padding-bottom: var(--spacing-xl); border-bottom: 1px solid var(--color-border);">
        <h3><a href="{{ .Permalink }}" style="color: var(--color-teal-dark); text-decoration: none;">{{ .Title }}</a></h3>
        <p class="text-muted">{{ .Summary }}</p>
        <a href="{{ .Permalink }}" class="news-link">Read More →</a>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
