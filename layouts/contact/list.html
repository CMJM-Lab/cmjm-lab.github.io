{{ define "main" }}
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <h1>Contact Us</h1>
      <p>Get in touch with CMJM Lab</p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-item">
        <div class="contact-icon">📧</div>
        <h3>Email</h3>
        <p><a href="mailto:info@cmjm-lab.org">info@cmjm-lab.org</a></p>
        <p class="text-muted">General inquiries</p>
      </div>
      <div class="contact-item">
        <div class="contact-icon">🏛️</div>
        <h3>Affiliation</h3>
        <p><strong>Dr. Mei-Ju May Chen (陳玫如)</strong></p>
        <p class="text-muted">Department/Institution</p>
      </div>
      <div class="contact-item">
        <div class="contact-icon">📍</div>
        <h3>Location</h3>
        <p>Address Line 1</p>
        <p class="text-muted">City, Country</p>
      </div>
    </div>

    <div style="margin-top: var(--spacing-2xl); background-color: var(--color-teal-light); padding: var(--spacing-xl); border-radius: 8px;">
      <div style="min-height: 300px; display: flex; align-items: center; justify-content: center; color: var(--color-muted);">
        <div style="text-align: center;">
          <div style="font-size: var(--font-size-2xl); margin-bottom: var(--spacing-md);">📍</div>
          <p>Map placeholder — Update with your location details</p>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
